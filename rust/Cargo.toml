[package]
name = "starter-iot-esp32"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"

[dependencies]
esp-hal = { version = "0.22.0", features = ["esp32"] }
esp-hal-embassy = { version = "0.5.0", features = ["esp32"] }
esp-backtrace = { version = "0.14.2", features = ["esp32", "panic-handler", "println", "exception-handler"] }
esp-println = { version = "0.12.0", features = ["esp32", "log"] }
log = "0.4"
embassy-executor = { version = "0.6.2", features = ["task-arena-size-20480"] }
embassy-time = "0.3.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = false
